# QubixDesk Production Nginx Configuration
# Domain: qubixdesk.toolio.tech
# Server IP: 2.25.126.135
# App Directory: /var/www/QubixTicketing
# API Port: 4050

# HTTP Server (Redirect all traffic to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name qubixdesk.toolio.tech;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (SSL Handled via Let's Encrypt)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qubixdesk.toolio.tech;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/qubixdesk.toolio.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qubixdesk.toolio.tech/privkey.pem;
    # SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client Static SPA
    root /var/www/QubixTicketing/client/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:4050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 25M;
    }

    # Real-time WebSocket Proxy (Socket.IO)
    location /socket.io {
        proxy_pass http://127.0.0.1:4050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Uploads Static Assets
    location /uploads/ {
        proxy_pass http://127.0.0.1:4050;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Health Check
    location /health {
        proxy_pass http://127.0.0.1:4050;
        proxy_set_header Host $host;
    }
}
