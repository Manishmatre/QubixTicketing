version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: godspeed-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: godspeed
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: godspeed-server
    restart: always
    ports:
      - "4060:4060"
    environment:
      PORT: 4060
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/godspeed
      JWT_SECRET: godspeed_enterprise_jwt_super_secret_key_2026_xyz!
      REFRESH_TOKEN_SECRET: godspeed_enterprise_refresh_super_secret_key_2026_xyz!
      CLIENT_URL: https://ticketing.godspeedhomesales.com
      SEED_ON_START: "true"
    depends_on:
      - mongodb
    volumes:
      - uploads-data:/app/server/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: godspeed-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data:
  uploads-data:

